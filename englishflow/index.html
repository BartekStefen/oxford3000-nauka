function speaking(){var words=Object.keys(S.lex).filter(function(k){return S.lex[k].level>0;}).slice(-5).map(function(k){return DATAID.get(+k);}).filter(Boolean).map(function(w){return w.w;});return h('Speaking Studio','Ćwicz w swoim tempie. Wybierz scenariusz, przygotuj krótką wypowiedź albo otwórz rozmowę z zewnętrznym korepetytorem AI.')+'<div class="grid cols2"><div class="card"><p class="eyebrow">YOUR PRACTICE</p><h3>Wybierz sytuację</h3>'+scenarios.map(function(s,i){return '<button class="quest-option" data-scenario="'+i+'"><strong>'+s[0]+' '+s[1]+'</strong><div class="tiny" style="margin-top:6px">'+s[2]+'</div></button>';}).join('')+'</div><div class="card"><p class="eyebrow">SPEAK & WRITE</p><h2 id="scenarioTitle">At a restaurant 🍽️</h2><p class="lead" id="scenarioHelp">Spróbuj zamówić danie po angielsku. Możesz najpierw napisać, co chcesz powiedzieć.</p>'+(words.length?'<p class="tiny">Spróbuj użyć swoich słów: <strong>'+esc(words.join(' · '))+'</strong></p>':'')+'<textarea class="textarea" id="speakingText" placeholder="I would like to order…">'+esc(S.journal[today]||'')+'</textarea><div class="row" style="margin-top:14px"><button class="btn small" data-action="savespeaking">✓ Zapisz ćwiczenie</button><button class="btn small alt" data-action="copyprompt">Kopiuj prompt do AI</button></div><div class="row" style="margin-top:22px"><a class="btn small soft" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">ChatGPT ↗</a><a class="btn small soft" href="https://gemini.google.com/" target="_blank" rel="noopener noreferrer">Gemini ↗</a></div><p class="tiny" style="margin-top:15px">Ta wersja nie analizuje jeszcze mowy ani nie łączy się automatycznie z obcymi czatami AI.</p></div></div>';}
function busuu(){return h('Busuu Premium','Traktujemy Busuu jako element nauki, zamiast kopiować cały jego kurs.')+'<div class="grid cols2"><div class="card busuu"><p class="eyebrow">TWOJA DZISIEJSZA LEKCJA</p><h2>Keep the momentum going.</h2><p class="lead">Otwórz Busuu, ukończ lekcję, a potem wróć tutaj. Postęp z Busuu potwierdzasz samodzielnie — nie pobieramy prywatnych danych Twojego konta.</p><a class="btn" href="https://www.busuu.com/" target="_blank" rel="noopener noreferrer">Przejdź do Busuu ↗</a></div><div class="card"><h3>Jak poszła lekcja?</h3><form id="busuuform"><label class="tiny">Temat (opcjonalnie)</label><input class="input" id="busuuTopic" style="width:100%;margin:7px 0 16px" placeholder="np. Past Simple"><label class="tiny">Czas nauki</label><select id="busuuMinutes" class="select" style="width:100%;margin:7px 0 17px"><option value="10">10 minut</option><option value="20" selected>20 minut</option><option value="30">30 minut</option><option value="45">45 minut</option></select><button class="btn" type="submit">✓ Ukończyłem lekcję</button></form></div></div><div class="card" style="margin-top:18px"><h3>Po lekcji: mini powtórka</h3><p class="lead">Utrwal poznany materiał w krótkim ćwiczeniu. To dodatek do Busuu, a nie druga taka sama lekcja.</p>'+btn('Przejdź do gramatyki','grammar','small soft')+' '+btn('Powtórz 15 słówek','review','small alt')+'</div>';}
function progress(){var done=Object.keys(S.grammar).length, known=learned();var dates=Array.from({length:7},function(_,i){var d=new Date();d.setDate(d.getDate()-(6-i));return {label:['Nd','Pn','Wt','Śr','Cz','Pt','So'][d.getDay()],n:S.days[dayKey(d)]||0};});var max=Math.max(3,...dates.map(function(d){return d.n;}));var levels=['A1','A2','B1','B2'];return h('Twoje postępy','Realne aktywności, poznane słowa i ukończone tematy. Bez sztucznego zawyżania wyników.')+'<div class="grid cols3"><div class="card stat"><div class="glyph">📚</div><div><strong>'+known+'</strong><small>Poznane rekordy</small></div></div><div class="card stat"><div class="glyph">🧩</div><div><strong>'+done+' / '+TOPICS.length+'</strong><small>Tematy gramatyczne</small></div></div><div class="card stat"><div class="glyph">✨</div><div><strong>'+activity()+'</strong><small>Aktywności łącznie</small></div></div></div><div class="grid cols2" style="margin-top:20px"><div class="card"><h3>Aktywność w ostatnich 7 dniach</h3><div class="chart">'+dates.map(function(d){return '<div class="chcol"><span class="tiny">'+d.n+'</span><div class="chbar" style="height:'+Math.round(d.n/max*120)+'px"></div><span>'+d.label+'</span></div>';}).join('')+'</div></div><div class="card"><h3>Oxford 3000 według poziomu</h3>'+levels.map(function(l){var a=DATA.filter(function(w){return w.c===l;}),b=a.filter(function(w){return S.lex[w.id]&&S.lex[w.id].level>=2;});return '<div class="baritem"><span>'+l+'</span><div class="progress-track"><i style="width:'+pct(b.length,a.length)+'%"></i></div><strong>'+pct(b.length,a.length)+'%</strong></div>';}).join('')+'<p class="tiny" style="margin-top:18px">Powtórki planowane są na podstawie wyników Twoich odpowiedzi.</p></div></div>';}
function profile(){return h('Ustawienia & profil','Wybierz tempo nauki, motyw i sposób zapisu swoich danych.')+'<div class="grid cols2"><div class="card"><h3>Codzienny plan</h3><p class="lead">Ile minut chcesz poświęcać na naukę?</p><div class="row">'+[5,15,30,60,90].map(function(n){return '<button class="btn small '+(S.minutes===n?'':'alt')+'" data-minutes="'+n+'">'+n+' min</button>';}).join('')+'</div><div class="sectionhead"><h3>Wygląd</h3></div><div class="row"><button class="btn small '+(S.theme==='dark'?'':'alt')+'" data-theme="dark">☾ Ciemny</button><button class="btn small '+(S.theme==='light'?'':'alt')+'" data-theme="light">☼ Jasny</button></div><div class="sectionhead"><h3>Kopia danych</h3></div><div class="row"><button class="btn small soft" data-action="export">↓ Eksport postępów</button><button class="btn small alt" data-action="import">↑ Import postępów</button><input type="file" id="importfile" accept=".json,application/json" class="hidden"></div><p class="tiny" style="margin-top:16px">Dane lokalne są zapisywane w tej przeglądarce. Eksport pozwala bezpiecznie zachować ich kopię.</p></div><div class="card"><h3>Synchronizacja telefonu i komputera</h3><p class="lead">Synchronizacja między urządzeniami wymaga skonfigurowanego projektu Supabase. Po skonfigurowaniu możesz zalogować się tym samym e-mailem na obu urządzeniach.</p><div id="cloudsection">'+(cloud?(currentUser?'<p class="message good">✓ Zalogowano: '+esc(currentUser.email||'konto')+'</p><div class="row"><button class="btn small" data-action="sync">↻ Synchronizuj</button><button class="btn small alt" data-action="logout">Wyloguj</button></div>':'<form id="loginform"><input id="loginemail" class="input" type="email" placeholder="Twój e-mail" required style="width:100%;margin:10px 0"><button type="submit" class="btn small">Wyślij link do logowania</button></form>'):'<div class="message">Tryb lokalny: połączenie z chmurą nie jest jeszcze skonfigurowane. W repozytorium znajdziesz plik <strong>supabase.sql</strong> i instrukcję uruchomienia.</div>')+'</div><p class="tiny" style="margin-top:16px">Nie udostępniaj haseł ani prywatnych kluczy API w kodzie strony.</p></div></div>';}
function render(){renderChrome();var v=page==='today'?dashboard():page==='learn'?learn():page==='words'?words():page==='flash'||page==='review'?flash():page==='quiz'?quiz():page==='grammar'?grammar():page==='lesson'?lesson():page==='listening'?listening():page==='speaking'?speaking():page==='busuu'?busuu():page==='progress'?progress():page==='profile'?profile():dashboard();$('#view').innerHTML=v;}
function go(p){page=p;if(p==='flash'||p==='review'||p==='quiz')chooseQueue(p==='review');if(p==='listening')question=null;history.replaceState({},'',location.pathname+'#'+p);render();window.scrollTo({top:0,behavior:'instant'});}
function speakWord(id){var w=DATAID.get(Number(id));if(!w)return;var src=w.wa?'../audio/'+w.wa:'';if(src){var a=new Audio(src);a.play().catch(function(){tts(w.w);});}else tts(w.w);}
function tts(s){if(!('speechSynthesis'in window)){toast('Przeglądarka nie obsługuje odtwarzania głosu.');return;}speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=.86;speechSynthesis.speak(u);}
function exportData(){var a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.href=url;a.download='englishflow-backup-'+today+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(url);},500);}
function importData(file){if(!file||file.size>10000000){toast('Nieprawidłowy plik');return;}var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.lex||typeof o.lex!=='object'||!o.done)throw Error('format');S=Object.assign(initial(),o);save();render();toast('Import danych zakończony!');}catch(e){toast('To nie jest kopia EnglishFlow');}};r.readAsText(file);}
var selectedScenario=0;
document.addEventListener('click',function(e){var x=e.target.closest('[data-go],[data-action],[data-complete],[data-grade],[data-fav],[data-speak],[data-lesson],[data-grammaranswer],[data-listenanswer],[data-theme],[data-minutes],[data-scenario]');if(!x)return;var d=x.dataset;if(d.go){go(d.go);return;}if(d.complete){if(doneToday()[d.complete])undoTask(d.complete);else{markTask(d.complete);render();}return;}if(d.grade){gradeNext(d.grade);return;}if(d.fav){var z=S.lex[d.fav]||{};z.fav=!z.fav;S.lex[d.fav]=z;save();render();return;}if(d.speak){speakWord(d.speak);return;}if(d.lesson!==undefined){selectedLesson=+d.lesson;go('lesson');return;}if(d.grammaranswer!==undefined){answerGrammar(+d.grammaranswer);return;}if(d.listenanswer!==undefined){answerListening(d.listenanswer);return;}if(d.theme){S.theme=d.theme;save();render();return;}if(d.minutes){S.minutes=+d.minutes;save();render();return;}if(d.scenario!==undefined){selectedScenario=+d.scenario;$('#scenarioTitle').textContent=scenarios[selectedScenario][1]+' '+scenarios[selectedScenario][0];$('#scenarioHelp').textContent=scenarios[selectedScenario][2]+' Try to respond in three sentences.';return;}
switch(d.action){case 'theme':S.theme=S.theme==='dark'?'light':'dark';save();render();break;case 'flip':flipped=!flipped;render();break;case 'nextquiz':qIndex++;if(qIndex>=queue.length){queue=[];markTask('oxford');go('words');}else render();break;case 'prevwords':wordPage=Math.max(0,wordPage-1);render();break;case 'nextwords':wordPage++;render();break;case 'listen':tts(question.ex);break;case 'revealtrans':$('#transcript').classList.toggle('hidden');break;case 'newlisten':question=null;render();break;case 'savespeaking':S.journal[today]=$('#speakingText').value;markTask('speaking');render();break;case 'copyprompt':var pr='Be my patient English tutor at A2/B1 level. Practice this situation: '+scenarios[selectedScenario][1]+'. Ask one short question at a time. After five replies, correct my 3 most important mistakes in Polish. Wait for my answer.';navigator.clipboard.writeText(pr).then(function(){toast('Skopiowano prompt!');}).catch(function(){toast('Kopiowanie niedostępne');});break;case 'export':exportData();break;case 'import':$('#importfile').click();break;case 'sync':sync();break;case 'logout':if(cloud)cloud.auth.signOut().then(function(){currentUser=null;render();});break;}});
document.addEventListener('change',function(e){if(e.target.id==='levelsel'){level=e.target.value;wordPage=0;render();}if(e.target.id==='statussel'){status=e.target.value;wordPage=0;render();}if(e.target.id==='importfile')importData(e.target.files[0]);});
document.addEventListener('input',function(e){if(e.target.id==='wordsearch'){search=e.target.value;wordPage=0;var p=e.target.selectionStart;render();var input=$('#wordsearch');if(input){input.focus();input.setSelectionRange(p,p);}}});
document.addEventListener('submit',function(e){if(e.target.id==='quizform'){e.preventDefault();quizSubmit();}if(e.target.id==='busuuform'){e.preventDefault();var topic=$('#busuuTopic').value.trim(),mins=Number($('#busuuMinutes').value);S.busuu.push({date:today,topic:topic,minutes:mins,t:Date.now()});markTask('busuu');render();}if(e.target.id==='loginform'){e.preventDefault();var email=$('#loginemail').value.trim();cloud.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.origin+location.pathname+'#profile'}}).then(function(o){toast(o.error?'Problem logowania: '+o.error.message:'Sprawdź skrzynkę e-mail i otwórz link.');});}});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.matches('.flash')){e.preventDefault();flipped=!flipped;render();}});
window.addEventListener('hashchange',function(){var n=location.hash.slice(1);if(['today','learn','words','progress','profile','grammar','listening','speaking','busuu'].includes(n)){page=n;render();}});
function mergeRemote(remote){if(!remote||typeof remote.lex!=='object')return;var all=new Set(Object.keys(S.lex).concat(Object.keys(remote.lex||{})));all.forEach(function(k){var l=S.lex[k],r=remote.lex[k];if(!l||(r&&(r.t||0)>(l.t||0)))S.lex[k]=r;});Object.keys(remote.done||{}).forEach(function(k){S.done[k]=Object.assign({},remote.done[k],S.done[k]||{});});Object.keys(remote.days||{}).forEach(function(k){S.days[k]=Math.max(S.days[k]||0,remote.days[k]||0);});S.grammar=Object.assign({},remote.grammar||{},S.grammar||{});S.journal=Object.assign({},remote.journal||{},S.journal||{});S.busuu=(S.busuu||[]).concat((remote.busuu||[]).filter(function(r){return !(S.busuu||[]).some(function(l){return l.t===r.t;});}));}
async function sync(){if(!cloud||!currentUser||busy)return;busy=true;try{var r=await cloud.from('englishflow_states').select('state').eq('user_id',currentUser.id).maybeSingle();if(r.error)throw r.error;if(r.data&&r.data.state)mergeRemote(r.data.state);var w=await cloud.from('englishflow_states').upsert({user_id:currentUser.id,state:S,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(w.error)throw w.error;save(false);toast('Postępy zsynchronizowane ✓');}catch(e){toast('Synchronizacja nieudana: '+(e.message||'błąd'));}finally{busy=false;render();}}
async function initCloud(){var cfg=window.ENGLISHFLOW_CLOUD||{};if(!cfg.url||!cfg.anonKey)return;try{var mod=await import('https://esm.sh/@supabase/supabase-js@2');cloud=mod.createClient(cfg.url,cfg.anonKey);var sess=await cloud.auth.getSession();if(sess.data&&sess.data.session){currentUser=sess.data.session.user;await sync();}cloud.auth.onAuthStateChange(function(event,session){var u=session&&session.user;if(u&&(!currentUser||u.id!==currentUser.id)){currentUser=u;setTimeout(sync,400);}if(!u){currentUser=null;render();}});render();}catch(e){toast('Nie udało się połączyć z Supabase');}}
async function init(){migrateLegacy();$('#view').innerHTML='<div class="card">Ładowanie biblioteki Oxford 3000…</div>';try{var res=await fetch('../data.json');if(!res.ok)throw Error(res.status);var json=await res.json();DATA=Array.isArray(json.words)?json.words:[];if(!DATA.length)throw Error('empty');DATAID=new Map(DATA.map(function(w){return [Number(w.id),w];}));}catch(e){console.error(e);$('#view').innerHTML='<div class="card"><h2>Nie udało się załadować słówek</h2><p>Otwórz stronę w repozytorium razem z oryginalnym plikiem <strong>data.json</strong> poziom wyżej: <code>../data.json</code>.</p><button class="btn" onclick="location.reload()">Spróbuj ponownie</button></div>';return;}page=['today','learn','words','progress','profile','grammar','listening','speaking','busuu'].includes(location.hash.slice(1))?location.hash.slice(1):'today';render();initCloud();}
init();
